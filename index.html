<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Settler - A Tribute to Classic City Building</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: 'Courier New', monospace;
      background: #1a1a1a;
      color: #fff;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      touch-action: none;
    }

    #game-canvas {
      display: block;
      background: #2d5016;
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #debug-info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: auto;
    }

    #controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 4px;
      pointer-events: auto;
    }

    button {
      background: #4a6741;
      color: white;
      border: 2px solid #6b8e5f;
      padding: 8px 16px;
      margin: 4px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      border-radius: 4px;
    }

    button:hover {
      background: #5a7751;
    }

    button:active {
      background: #3a5731;
    }

    button.selected {
      background: #7a9771;
      border-color: #9ab791;
    }

    #selection-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 4px;
      pointer-events: auto;
      display: none;
      min-width: 200px;
    }

    #selection-panel h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #ffff00;
    }

    #selection-panel button {
      width: 100%;
      margin: 4px 0;
    }

    button.delete {
      background: #c44;
      border-color: #e66;
    }

    button.delete:hover {
      background: #d55;
    }

    #inventory-panel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      padding: 20px;
      border-radius: 8px;
      pointer-events: auto;
      display: none;
      min-width: 400px;
      max-width: 500px;
      border: 3px solid #8b1a1a;
      box-shadow: 0 0 20px rgba(139, 26, 26, 0.5);
    }

    #inventory-panel h3 {
      margin: 0;
      font-size: 16px;
      color: #ffff00;
    }

    #inventory-panel h4 {
      color: #ddd;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    #inventory-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .inventory-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .inventory-item-name {
      color: #ccc;
    }

    .inventory-item-count {
      color: #ffff00;
      font-weight: bold;
    }

    #minimap {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 200px;
      height: 200px;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #6b8e5f;
      border-radius: 4px;
      pointer-events: auto;
      cursor: pointer;
    }

    #minimap-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay">
      <div id="debug-info">
        <div>FPS: <span id="fps">0</span></div>
        <div>Entities: <span id="entity-count">0</span></div>
        <div>Mode: <span id="current-mode">View</span></div>
      </div>
      <div id="controls">
        <div>
          <button id="btn-view">View Mode</button>
          <button id="btn-road">Build Road</button>
          <button id="btn-warehouse">Build Warehouse</button>
          <button id="btn-lumberjack">Build Lumberjack</button>
        </div>
        <div style="margin-top: 10px;">
          <button id="btn-spawn-worker">Spawn Worker</button>
          <button id="btn-save">Save Game</button>
          <button id="btn-load">Load Game</button>
        </div>
      </div>
      <div id="selection-panel">
        <h3 id="selection-title">Selected: Building</h3>
        <p style="font-size: 11px; margin: 5px 0; opacity: 0.8;">Click and drag to move</p>
        <button id="btn-delete" class="delete">Delete</button>
      </div>
      <div id="inventory-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h3 style="margin: 0;">🏕️ Base Camp</h3>
          <button id="btn-close-inventory" style="padding: 4px 12px; margin: 0;">✕</button>
        </div>
        <div style="font-size: 11px; margin-bottom: 10px; opacity: 0.8;">
          <div>Population: <span id="population-display">0/0</span></div>
        </div>
        <h4 style="margin: 10px 0 5px 0; font-size: 12px;">Resources</h4>
        <div id="inventory-list" style="max-height: 400px; overflow-y: auto; font-size: 11px;"></div>
      </div>
      <div id="minimap">
        <canvas id="minimap-canvas" width="200" height="200"></canvas>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
